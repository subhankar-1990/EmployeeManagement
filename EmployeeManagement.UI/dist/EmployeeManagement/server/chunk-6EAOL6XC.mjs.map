<div class="dialog-backdrop" (click)="onBackdropClick($event)">
  <div class="dialog" role="alertdialog" aria-modal="true" [attr.aria-label]="title()">
    <h2 class="dialog__title">{{ title() }}</h2>
    <p class="dialog__message">{{ message() }}</p>

    <div class="dialog__actions">
      <button type="button" class="btn btn--secondary" [disabled]="busy()" (click)="onCancel()">
        {{ cancelLabel() }}
      </button>
      <button type="button" class="btn btn--danger" [disabled]="busy()" (click)="onConfirm()">
        @if (busy()) {
          <span class="spinner spinner--sm" aria-hidden="true"></span>
        }
        <span>{{ confirmLabel() }}</span>
      </button>
    </div>
  </div>
</div>
