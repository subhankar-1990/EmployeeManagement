<div class="shell">
  <header class="shell__header">
    <a class="brand" routerLink="/employees">
      <span class="brand__mark" aria-hidden="true">EM</span>
      <span class="brand__text">{{ title() }}</span>
    </a>

    <nav class="shell__nav" aria-label="Main navigation">
      <a
        class="shell__link"
        routerLink="/employees"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        Employees
      </a>
      <a class="shell__link" routerLink="/employees/new" routerLinkActive="is-active">Add employee</a>
    </nav>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>

  <footer class="shell__footer">Employee Management &middot; ASP.NET Core Web API</footer>
</div>
